[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "py-nfi"
dynamic = ["version"]
description = "Normalized frequency index (nFI) computation for earthquake source spectra"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ian Vandevert", email = "ivandevert@gmail.com" },
]
keywords = ["seismology", "earthquake", "spectral analysis", "source spectra"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "build", "twine"]

[project.urls]
Homepage = "https://github.com/ivandevert/py-nfi"
Repository = "https://github.com/ivandevert/py-nfi"
Issues = "https://github.com/ivandevert/py-nfi/issues"
Paper = "https://doi.org/10.1785/0120250171"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_file = "src/nfi/_version.py"